# supabase/config.toml — Version 1.2 | LifeGame 3.0 — local Supabase configuration
# Generated for local development and database testing only.
# No production credentials or secrets belong in this file.

project_id = "lifegame"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
additional_redirect_urls = ["http://localhost:54321"]

[analytics]
enabled = false

[functions.training-sessions]
# Require a valid Supabase JWT at the Edge gateway; handler verifies the user again.
verify_jwt = true

[functions.training-programs]
# Require a valid Supabase JWT at the Edge gateway; handler verifies the user again.
verify_jwt = true
