# .github/workflows/copy-lifegame-source.yml — Version 1.1
# Disabled after the initial snapshot. Design work must never trigger a destructive
# rsync --delete from the upstream LifeGame repository.

name: Copy LifeGame source snapshot (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled snapshot sync
        run: echo "Snapshot sync is disabled. Transfer only reviewed file diffs explicitly."
