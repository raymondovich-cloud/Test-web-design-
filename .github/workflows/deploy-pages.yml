name: LifeGame Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp -R platforms/web/. dist/
          cp -R source dist/source

          # The published artifact has platforms/web as its root.
          # Adjust imports that were relative to the repository layout.
          find dist -type f \( -name "*.html" -o -name "*.js" \) -print0 |
            xargs -0 sed -i \
              -e 's#../../../source#../source#g' \
              -e 's#../../source#./source#g'

          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
