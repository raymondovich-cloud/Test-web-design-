# .github/workflows/preview-publish.yml — Version 2.8
name: LifeGame Preview CI

on:
  push:
    branches:
      - feature/pwa-static-cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifegame-preview-ci
  cancel-in-progress: true

jobs:
  validate:
    name: Validate preview source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LifeGame
        uses: actions/checkout@v4
        with:
          ref: feature/pwa-static-cache

      - name: Validate required web entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s platforms/web/index.html
          test -s platforms/web/web.js
          test -s platforms/web/service-worker.js
          test -s source/design/design.css
          test -s docs/agent.md
          echo "Required LifeGame web entry points are present."

      - name: Validate local Design System imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          errors = []
          for css in (root / "source/design").rglob("*.css"):
              text = css.read_text(encoding="utf-8")
              for match in re.finditer(r'@import\s+(?:url\()?["\']([^"\']+)["\']\)?', text):
                  target = match.group(1).split("?", 1)[0]
                  if target.startswith(("http://", "https://", "//", "data:")):
                      continue
                  resolved = (css.parent / target).resolve()
                  if not resolved.is_file():
                      errors.append(f"{css}: missing import {target}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Local Design System imports are valid.")
          PY

      - name: Validate Health presentation syntax
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check source/presentation/health/health.js
          node --experimental-default-type=module --check source/presentation/training/training-overview.js
          node --experimental-default-type=module --check source/presentation/training/training-analytics.js
          node --experimental-default-type=module --check source/domain/training/training-analytics.js
          node --experimental-default-type=module --check source/application/training/training-analytics.js
          node --experimental-default-type=module --check source/presentation/training/training.js
          node --experimental-default-type=module --check source/application/training/training-workout-library.js
          node --experimental-default-type=module --check source/infrastructure/supabase/training-workout-library.api.js
          node --experimental-default-type=module --check source/presentation/training/training-session.js
          node --experimental-default-type=module --check source/presentation/health/section.analytics.js
          node --experimental-default-type=module --check source/domain/training/training-program.js
          node --experimental-default-type=module --check source/application/training/training-program-persistence-result.js
          node --experimental-default-type=module --check source/application/training/get-training-program.js
          node --experimental-default-type=module --check source/application/training/save-training-program.js
          node --experimental-default-type=module --check source/application/training/training-overview.read-model.js
          node --experimental-default-type=module --check source/application/training/load-training-overview.js
          node --experimental-default-type=module --check source/infrastructure/supabase/training-overview.api.js
          node --experimental-default-type=module --check source/infrastructure/supabase/training-session.repository.js
          node --experimental-default-type=module --check supabase/functions/training-sessions/handler.js
          node --experimental-default-type=module --check source/infrastructure/supabase/training-program.repository.js
          node --experimental-default-type=module --check source/infrastructure/security/training-program-payload-encryption.js
          node --experimental-default-type=module --check supabase/functions/training-programs/handler.js
          node --experimental-default-type=module --test source/domain/training/training-analytics.test.mjs source/application/training/training-analytics.test.mjs source/application/training/training-workout-library.test.mjs source/domain/training/training-program.test.mjs source/application/training/training-program.test.mjs source/application/training/training-overview.read-model.test.mjs source/application/training/load-training-overview.test.mjs source/infrastructure/supabase/training-session.repository.test.mjs source/infrastructure/supabase/training-overview.api.test.mjs supabase/functions/training-programs/handler.test.mjs supabase/functions/training-sessions/handler.test.mjs
          echo "Training Program persistence boundary and Application tests passed."

      - name: Validate Finance presentation and carousel
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check source/presentation/finance/finance.js
          node --experimental-default-type=module --check source/presentation/finance/finance.carousel.js
          node --experimental-default-type=module --check platforms/web/web.runtime.js
          node --experimental-default-type=module --check platforms/web/composition/root.js
          node --experimental-default-type=module --test source/presentation/finance/finance.carousel.test.mjs
          echo "Finance presentation syntax and carousel tests passed."

      - name: Test finance voice, burden lifecycle and FSI
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --test source/application/voice/finance-command.parser.test.mjs source/domain/finance/financial.burden/financial.burden.test.mjs source/index/finance/finance.index.test.mjs

      - name: Test profile role and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --test source/application/profile/profile.test.mjs source/infrastructure/supabase/profile.adapter.test.mjs

      - name: Validate Identity registration
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check source/presentation/auth/register.js
          node --experimental-default-type=module --check source/domain/identity/registration.policy.js
          node --experimental-default-type=module --check source/infrastructure/identity/supabase.identity.adapter.js
          node --experimental-default-type=module --test source/application/identity/registration.test.mjs source/infrastructure/identity/supabase.identity.adapter.test.mjs
          echo "Identity registration validation and adapter tests passed."

      - name: Request preview deployment
        if: success()
        env:
          TEST_WEB_DISPATCH_TOKEN: ${{ secrets.TEST_WEB_DISPATCH_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TEST_WEB_DISPATCH_TOKEN" ]; then
            echo "::warning::TEST_WEB_DISPATCH_TOKEN is not configured. Test-web-functional will pick up the latest source through its scheduled fallback."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TEST_WEB_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/raymondovich-cloud/Test-web-functional/dispatches \
            --data "{\"event_type\":\"lifegame-preview\",\"client_payload\":{\"source_commit\":\"$SOURCE_COMMIT\"}}"
          echo "Test-web-functional was asked to publish source commit $SOURCE_COMMIT."
